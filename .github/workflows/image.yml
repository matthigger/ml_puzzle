# Build each puzzle's re-run image (verify/Dockerfile) once and push it to
# GitHub's container registry, so a re-run pulls it instead of building it
# (see verify.yml). Tagged by content (.github/verify_image.sh): an image
# that's already there is left alone.
name: Build re-run images

on:
  push:
    branches: [main]
    paths:
      - "*/py/**"
      - "*/verify/Dockerfile"
      - "*/verify/child.py"
      - ".github/verify_image.sh"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        puzzle: [slice_crawl, where_start, ghost_circuit]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.puzzle }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to the registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          image=$(../.github/verify_image.sh)
          if docker manifest inspect "$image" > /dev/null 2>&1; then
            echo "already built: $image"
            exit 0
          fi
          docker build -q -f verify/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t "$image" .
          docker push -q "$image"

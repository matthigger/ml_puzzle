# Re-run waiting leaderboard entries: one job per puzzle, each with its own
# verify/verify.py. Every post dispatches this for its puzzle
# (supabase/schema.sql, dispatch_rerun); the schedule is the fallback, and
# runs all three. Needs repo secrets SUPABASE_URL and SUPABASE_SECRET_KEY;
# without them it does nothing. The students' code runs in a bubblewrap
# sandbox (shared/sandbox.py) that sees neither.
name: Re-run leaderboard entries
run-name: Re-run ${{ inputs.puzzle || 'all' }}

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      puzzle:
        type: choice
        options: [all, slice_crawl, where_start, ghost_circuit]
        default: all

permissions:
  contents: read

jobs:
  rerun:
    strategy:
      fail-fast: false
      matrix:
        puzzle: ${{ fromJSON((inputs.puzzle && inputs.puzzle != 'all')
          && format('["{0}"]', inputs.puzzle)
          || '["slice_crawl", "where_start", "ghost_circuit"]') }}
    # one run per puzzle at a time, and at most one waiting (a newer one
    # replaces it): a burst of posts makes two runs, not one each.
    # verify.py keeps inside this timeout
    concurrency:
      group: verify-${{ matrix.puzzle }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: ${{ matrix.puzzle }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # what the students' code may import (and the instances need), in a
      # venv kept between runs
      - id: venv
        uses: actions/cache@v4
        with:
          path: ~/venv
          key: venv-${{ steps.python.outputs.python-version }}-${{ hashFiles('shared/requirements.txt') }}
      - name: Install the libraries
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv ~/venv
          ~/venv/bin/pip install --quiet -r ../shared/requirements.txt
      - id: waiting
        name: Count waiting entries
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "Leaderboard secrets not set: nothing to do."
            echo "n=0" >> "$GITHUB_OUTPUT"
          else
            echo "n=$(~/venv/bin/python verify/verify.py --count)" \
              >> "$GITHUB_OUTPUT"
          fi
      # bubblewrap, allowed the user namespaces Ubuntu restricts by default
      # (this machine is thrown away after the job)
      - name: Set up the sandbox
        if: steps.waiting.outputs.n != '0'
        run: |
          command -v bwrap > /dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq bubblewrap > /dev/null
          }
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0 \
            || true
          bwrap --version
      - name: Re-run
        if: steps.waiting.outputs.n != '0'
        run: ~/venv/bin/python verify/verify.py
